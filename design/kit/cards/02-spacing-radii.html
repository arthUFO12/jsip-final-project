<!-- @dsCard group="Foundations" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spacing, radii, focus</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../kit.css">
<!-- Class names are API — restyle, never rename. Edits belong in tokens.css / kit.css. -->
<style>
  body { padding: 24px; }
  .ds-heading { color: var(--ink-muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin: 22px 0 10px; }
  .ds-heading:first-child { margin-top: 0; }
  .ds-row { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
  .ds-space { background: var(--brand-strong-a); border-radius: 2px; }
  .ds-caption { color: var(--ink-faint); font-size: 11px; font-family: var(--font-mono); margin-top: 4px; text-align: center; }
  .ds-radius { width: 90px; height: 56px; background: var(--panel); border: 1px solid var(--border); }
</style>
</head>
<body>
  <p class="ds-heading">Space scale</p>
  <div class="ds-row">
    <div><div class="ds-space" style="width:4px;height:28px"></div><div class="ds-caption">--space-1<br>4</div></div>
    <div><div class="ds-space" style="width:8px;height:28px"></div><div class="ds-caption">--space-2<br>8</div></div>
    <div><div class="ds-space" style="width:12px;height:28px"></div><div class="ds-caption">--space-3<br>12</div></div>
    <div><div class="ds-space" style="width:16px;height:28px"></div><div class="ds-caption">--space-4<br>16</div></div>
    <div><div class="ds-space" style="width:20px;height:28px"></div><div class="ds-caption">--space-5<br>20</div></div>
    <div><div class="ds-space" style="width:26px;height:28px"></div><div class="ds-caption">--space-6<br>26</div></div>
    <div><div class="ds-space" style="width:32px;height:28px"></div><div class="ds-caption">--space-7<br>32</div></div>
  </div>

  <p class="ds-heading">Radii</p>
  <div class="ds-row">
    <div><div class="ds-radius" style="border-radius:var(--radius-s)"></div><div class="ds-caption">--radius-s · 8</div></div>
    <div><div class="ds-radius" style="border-radius:var(--radius-m)"></div><div class="ds-caption">--radius-m · 10</div></div>
    <div><div class="ds-radius" style="border-radius:var(--radius-l)"></div><div class="ds-caption">--radius-l · 12</div></div>
    <div><div class="ds-radius" style="border-radius:var(--radius-pill);height:36px"></div><div class="ds-caption">--radius-pill</div></div>
  </div>

  <p class="ds-heading">Focus ring (keyboard) — 2px accent, 2px offset</p>
  <div class="ds-row">
    <button class="btn-primary" style="outline:2px solid var(--accent);outline-offset:2px">Run backtest</button>
    <button class="nav-button" style="outline:2px solid var(--accent);outline-offset:2px">Markets</button>
  </div>
</body>
</html>
